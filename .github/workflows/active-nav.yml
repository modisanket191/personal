name: Active section navigation
on:
  push:
    branches: [master]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation and favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css='''
<style id="active-nav-fix">
.navlinks a.active{color:var(--white)!important;background:rgba(125,211,252,.10);border-color:#465563;box-shadow:inset 0 -2px 0 var(--accent)}
@media(max-width:800px){
  header nav{height:auto;min-height:112px;padding:10px 0 0}
  .nav-inner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  .navlinks{order:2;flex:1 1 100%;width:100%;max-width:100%;display:flex!important;justify-content:flex-start!important;flex-wrap:nowrap!important;gap:8px!important;overflow-x:auto!important;overflow-y:hidden!important;padding:6px 0 10px;scrollbar-width:none}
  .navlinks::-webkit-scrollbar{display:none}
  .navlinks a:not(.nav-cta){display:inline-flex!important;font-size:11px;padding:6px 8px;white-space:nowrap;flex:0 0 auto}
  .nav-cta{display:inline-flex!important;font-size:11px!important;padding:6px 10px!important;white-space:nowrap;flex:0 0 auto}
  .navlinks a.active{box-shadow:inset 0 -2px 0 var(--accent)}
  html{scroll-padding-top:112px!important}
  section{scroll-margin-top:112px!important}
}
</style>
'''
          if 'id="active-nav-fix"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          old_prefix='<link href=\'data:image/svg+xml,'
          old_start=s.find(old_prefix)
          if old_start != -1:
              old_end=s.find('/>',old_start)
              if old_end != -1:
                  s=s[:old_start]+'<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>\n<link rel="shortcut icon" href="assets/favicon.svg" type="image/svg+xml"/>'+s[old_end+2:]

          js='''
<script id="active-nav-script">
(function(){
  const links=[...document.querySelectorAll('.navlinks a[href^="#"]')];
  const sections=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
  if(!sections.length)return;
  const setActive=id=>links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+id));
  const observer=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);
    if(visible[0])setActive(visible[0].target.id);
  },{rootMargin:'-120px 0px -55% 0px',threshold:[0.05,0.2,0.5]});
  sections.forEach(s=>observer.observe(s));
  setActive(sections[0].id);
})();
</script>
'''
          if 'id="active-nav-script"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/active-nav.yml
          git commit -m 'Fix mobile navigation and favicon' || exit 0
          git push