name: Active section navigation
on:
  push:
    branches: [master]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add active navigation behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n<style id="active-nav-fix">\n.navlinks a.active{color:var(--white)!important;background:rgba(125,211,252,.10);border-color:#465563;box-shadow:inset 0 -2px 0 var(--accent)}\n@media(max-width:800px){header nav{height:auto;min-height:72px;padding:9px 0}.navlinks{width:100%;justify-content:flex-end;flex-wrap:wrap;gap:6px 8px}.navlinks a:not(.nav-cta){display:inline-flex;font-size:11px;padding:6px 7px;white-space:nowrap}.nav-cta{font-size:11px!important;padding:6px 9px!important;white-space:nowrap}.navlinks a.active{box-shadow:inset 0 -2px 0 var(--accent)}}\n</style>\n'''
          if 'id="active-nav-fix"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          js='''\n<script id="active-nav-script">\n(function(){\n  const links=[...document.querySelectorAll('.navlinks a[href^="#"]')];\n  const sections=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);\n  if(!sections.length)return;\n  const setActive=id=>links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+id));\n  const observer=new IntersectionObserver(entries=>{\n    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);\n    if(visible[0])setActive(visible[0].target.id);\n  },{rootMargin:'-92px 0px -55% 0px',threshold:[0.05,0.2,0.5]});\n  sections.forEach(s=>observer.observe(s));\n  setActive(sections[0].id);\n})();\n</script>\n'''
          if 'id="active-nav-script"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/active-nav.yml
          git commit -m 'Highlight active section in navigation' || exit 0
          git push