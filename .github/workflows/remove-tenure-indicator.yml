name: Remove tenure indicator line
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visual tenure bars and legend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '\n/* Hide tenure indicator bars; keep duration badges */\n.tenure-track,.tenure-legend{display:none!important}\n'
          if css.strip() not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-tenure-indicator.yml
          git rm .github/workflows/remove-tenure-indicator.yml
          git commit -m 'Remove experience tenure indicator line' || exit 0
          git push
