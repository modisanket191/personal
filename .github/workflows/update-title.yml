name: Update portfolio title
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Principal Engineer to Technical Lead
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Principal Engineer', 'Technical Lead')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-title.yml
          git rm .github/workflows/update-title.yml
          git commit -m 'Change portfolio title to Technical Lead'
          git push
