name: Hide experience indicators

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hide tenure indicator bars
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="hide-tenure-indicators">.tenure-track,.tenure-legend{display:none!important}</style>'
          if marker not in s:
              s = s.replace('</head>', marker + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit site change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Hide experience duration indicator bars" && git push)
