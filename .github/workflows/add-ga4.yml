name: Add GA4 analytics

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  add-ga4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google Analytics 4
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'G-5RMZ01LYWV'
          if marker not in s:
              tag = '''\n<!-- Google Analytics 4 -->\n<script async src="https://www.googletagmanager.com/gtag/js?id=G-5RMZ01LYWV"></script>\n<script>\n  window.dataLayer = window.dataLayer || [];\n  function gtag(){dataLayer.push(arguments);}\n  gtag('js', new Date());\n  gtag('config', 'G-5RMZ01LYWV');\n</script>\n'''
              s = s.replace('</head>', tag + '</head>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit analytics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Google Analytics tracking'
          git push
