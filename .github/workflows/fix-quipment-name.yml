name: Fix Quipment company name
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Quipment branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'Insigno Quipment Technologies · Software Engineer':'Insigno Quipment Technologies Pvt. Ltd. · Software Engineer',
            'Insigno Quipment Technologies':'Insigno Quipment Technologies Pvt. Ltd.'
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-quipment-name.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use official Quipment company name'
          git push
