name: Fix Mobile Horizontal Overflow

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* Mobile overflow fix */\nhtml, body { overflow-x: hidden; max-width: 100%; }\nheader, nav { max-width: 100%; overflow: hidden; }\n@media (max-width: 800px) {\n  nav { justify-content: flex-end; overflow: hidden; }\n  .navlinks { max-width: 100%; flex-wrap: wrap; justify-content: flex-end; overflow: hidden; }\n  .navlinks a { white-space: nowrap; }\n  .nav-cta { flex-shrink: 0; }\n}\n'''
          if '/* Mobile overflow fix */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "No changes needed"; else git add index.html && git commit -m "Fix mobile horizontal overflow" && git push; fi
