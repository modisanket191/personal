name: Update company logos
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  logos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate local company brand marks
        shell: bash
        run: |
          mkdir -p assets/logos
          curl -L --fail --silent --show-error 'https://www.google.com/s2/favicons?domain=cognizant.com&sz=128' -o assets/logos/cognizant.png
          curl -L --fail --silent --show-error 'https://www.google.com/s2/favicons?domain=tcs.com&sz=128' -o assets/logos/tcs.png
          curl -L --fail --silent --show-error 'https://www.google.com/s2/favicons?domain=indianic.com&sz=128' -o assets/logos/indianic.png
          curl -L --fail --silent --show-error 'https://www.google.com/s2/favicons?domain=quipment.in&sz=128' -o assets/logos/quipment.png
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          mapping={'COG':'cognizant.png','TCS':'tcs.png','IN':'indianic.png','IQT':'quipment.png'}
          for old,file in mapping.items():
              s=s.replace(f'<span class="company-logo-mark">{old}</span>', f'<span class="company-logo-mark"><img src="assets/logos/{file}" alt="Company logo"></span>')
          s=s.replace('filter:grayscale(1) brightness(1.35);opacity:.88','filter:none;opacity:1')
          css='''.company-logo-mark{width:120px;height:38px;border:0;border-radius:0;background:transparent;display:inline-flex;align-items:center;justify-content:flex-start;flex:none}.company-logo-mark img{width:100%;height:100%;object-fit:contain;object-position:left center;display:block}.company-brand{display:inline-flex;align-items:center;gap:14px}.company-brand>span:last-child{color:var(--accent2)}@media(max-width:600px){.company-logo-mark{width:90px;height:30px}.company-brand{gap:10px;align-items:flex-start}}'''
          s=s.replace('</style>\n</head>', css+'</style>\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/logos .github/workflows/update-company-logos.yml
          git rm .github/workflows/update-company-logos.yml
          git commit -m 'Integrate company brand logos'
          git push
