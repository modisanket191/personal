name: Fix portfolio mobile layout
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken company logos and mobile header
        shell: bash
        run: |
          python -m pip install beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          path=Path('index.html')
          soup=BeautifulSoup(path.read_text(encoding='utf-8'),'html.parser')
          marks={
            'Cognizant Technology Services':'COG',
            'Tata Consultancy Services':'TCS',
            'IndiaNIC InfoTech Limited':'IN',
            'Insigno Quipment Technologies':'IQT'
          }
          for job in soup.select('.job'):
            company=job.select_one('.company')
            if not company: continue
            text=company.get_text(' ',strip=True)
            key=next((k for k in marks if k in text),None)
            if key:
              company.clear()
              wrap=soup.new_tag('span',attrs={'class':'company-brand'})
              mark=soup.new_tag('span',attrs={'class':'company-logo-mark'}); mark.string=marks[key]; wrap.append(mark)
              name=soup.new_tag('span'); name.string=text; wrap.append(name); company.append(wrap)
          style=soup.find('style')
          css='''\n.company-brand{display:inline-flex;align-items:center;gap:12px}.company-logo-mark{width:78px;height:34px;border:1px solid #3a4652;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:#0d1116;color:#dce4ec;font-family:"Space Grotesk",sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;flex:none}.company-brand>span:last-child{color:var(--accent2)}@media(max-width:600px){.company-brand{align-items:flex-start;gap:10px}.company-logo-mark{width:66px;height:30px;font-size:10px}}@media(max-width:800px){header nav{height:60px}.navlinks{width:100%;justify-content:flex-end}.nav-cta{font-size:12px;padding:8px 13px}}\n'''
          if style and '.company-logo-mark' not in style.get_text(): style.append(css)
          path.write_text(str(soup),encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-portfolio-mobile.yml
          git rm .github/workflows/fix-portfolio-mobile.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix company logos on mobile'
          git push
